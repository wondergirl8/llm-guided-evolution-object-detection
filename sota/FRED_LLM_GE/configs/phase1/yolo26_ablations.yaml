# Separate YOLO26 pilot experiments on the search-validation split only.
# Each comparison changes one setting or one detection-path layer.
repeat_seeds: [0, 1, 2]
sources:
  seed: seeds/seed_yolo26n_p2.yaml
experiments:
  seed: {model: seed}
  seed_longer: {model: seed, compare_to: seed, epochs: 40}
  seed_sgd: {model: seed, compare_to: seed, train: {optimizer: SGD}}
  seed_sgd_low_lr: {model: seed, compare_to: seed_sgd, train: {optimizer: SGD, lr0: 0.001}}
  seed_no_mosaic: {model: seed, compare_to: seed, train: {mosaic: 0.0}}
  seed_no_hsv_saturation: {model: seed, compare_to: seed, train: {hsv_s: 0.0}}
  seed_p4_half: {model: seed, compare_to: seed, edit: {section: head, index: 14, channels: 256}}
  seed_p5_half: {model: seed, compare_to: seed, edit: {section: head, index: 17, channels: 512}}
