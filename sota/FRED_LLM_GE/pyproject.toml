[project]
name = "fred-llm-ge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==4.8.5",
    "huggingface-hub==0.35.1",
    "pillow>=10",
    "scipy>=1.18.1",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = ["pytest>=8.3.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["phase0_data"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true